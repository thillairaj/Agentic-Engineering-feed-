name: Update feed data

on:
  schedule:
    # Runs at 00:00, 08:00, 16:00 UTC - 3x/day, every 8 hours.
    - cron: "0 0,8,16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest articles
        run: python3 scripts/fetch_feeds.py

      - name: Commit updated data
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add data/articles.json
          git diff --quiet --cached || git commit -m "Auto-update: refresh 24h window $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
